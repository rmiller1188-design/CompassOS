name: Expand M26 Source

on:
  workflow_dispatch:
  push:
    branches: [m26-connected-accounts]
    paths:
      - 'm26-payload-*.txt'
      - '.github/workflows/bootstrap-m26.yml'

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          STAGING_COMMIT='ec5014963dae83fc74334b8628300a413baaa16f'
          ARCHIVE='/tmp/m26-source.tar.gz'
          : > "$ARCHIVE"

          mapfile -t PARTS < <(
            git ls-tree -r --name-only "$STAGING_COMMIT" |
              grep -E '^m26-payload-[0-9]{2}\.txt$' |
              sort
          )

          if [ "${#PARTS[@]}" -ne 13 ]; then
            echo "Expected 13 payload chunks; found ${#PARTS[@]}."
            exit 1
          fi

          for part in "${PARTS[@]}"; do
            echo "Decoding $part"
            git show "${STAGING_COMMIT}:${part}" |
              tr -d '\r\n' |
              base64 --decode >> "$ARCHIVE"
          done

          gzip -t "$ARCHIVE"
          echo "M26 source archive reconstructed and verified."

      - name: Replace static prototype with M26 source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'm26-payload-*.txt' \
            -exec rm -rf {} +
          tar -xzf /tmp/m26-source.tar.gz -C .
          rm -f m26-payload-*.txt

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Expand M26 connected accounts source'
          git push origin HEAD:m26-connected-accounts
