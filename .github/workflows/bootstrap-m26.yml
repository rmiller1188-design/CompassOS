name: Import M26 Source ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate and verify source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'CompassOS_M26_Connected_Accounts*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No CompassOS M26 source ZIP was found in the repository root."
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Using $ZIP_FILE"
          unzip -t "$ZIP_FILE"

      - name: Expand M26 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/compass-m26
          mkdir -p /tmp/compass-m26
          unzip -q "$ZIP_FILE" -d /tmp/compass-m26
          SOURCE=/tmp/compass-m26/CompassOS_M26
          test -f "$SOURCE/package.json"
          test -d "$SOURCE/src"
          test -d "$SOURCE/supabase"

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          mkdir -p .github
          rsync -a --delete "$SOURCE/.github/" .github/
          rsync -a --exclude '.github' "$SOURCE/" ./

          rm -f m26-payload-*.txt m26-direct-*.txt CompassOS_M26_Connected_Accounts*.zip

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Import M26 connected accounts source'
          git push origin HEAD:m26-connected-accounts
