name: Finish Compass M26

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch containing the validated M26 source
        required: true
        default: m26-connected-accounts
        type: string
      app_url:
        description: Full URL of the separate M26 Render web service
        required: true
        default: https://compass-os-m26.onrender.com
        type: string
      project_name:
        description: Supabase project name
        required: true
        default: CompassOS-M26
        type: string
      project_ref:
        description: Existing Supabase project ref; leave blank to create or reuse by name
        required: false
        type: string
      org_slug:
        description: Supabase organization slug; optional when the account has one organization
        required: false
        type: string
      region:
        description: Supabase region
        required: true
        default: us-west-2
        type: string
      render_service_id:
        description: Separate compass-os-m26 Render service ID; may also be stored as a repository secret
        required: false
        type: string

concurrency:
  group: finish-compass-m26
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    name: Provision and deploy M26
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout validated M26 source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate source and migrations
        run: |
          node scripts/check-migrations.mjs
          node --check scripts/provision-m26.mjs

      - name: Provision Supabase and configure Render
        id: infrastructure
        run: node scripts/provision-m26.mjs
        env:
          M26_TARGET_BRANCH: ${{ inputs.target_branch }}
          M26_APP_URL: ${{ inputs.app_url }}
          M26_PROJECT_NAME: ${{ inputs.project_name }}
          M26_PROJECT_REF: ${{ inputs.project_ref }}
          M26_ORG_SLUG: ${{ inputs.org_slug }}
          M26_REGION: ${{ inputs.region }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_M26_SERVICE_ID: ${{ inputs.render_service_id || secrets.RENDER_M26_SERVICE_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_TENANT: ${{ secrets.MICROSOFT_TENANT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
