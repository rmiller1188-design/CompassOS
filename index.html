<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Compass AI</title>
<meta name="theme-color" content="#6e5cff">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d12;color:#f7f8fb}.boot{width:min(460px,calc(100% - 32px));padding:28px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:#171a21;box-shadow:0 24px 70px rgba(0,0,0,.38)}.mark{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#6e5cff,#8f7cff);display:grid;place-items:center;font-weight:800;font-size:22px}.bar{height:8px;border-radius:999px;background:#292e39;overflow:hidden;margin-top:20px}.bar span{display:block;width:35%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#6e5cff,#8f7cff);animation:load 1.1s ease-in-out infinite alternate}.boot h1{font-size:22px;margin:18px 0 6px}.boot p{color:#9aa1ad;font-size:13px;line-height:1.5;margin:0}@keyframes load{to{transform:translateX(185%)}}
</style>
</head>
<body>
<main class="boot"><div class="mark">C</div><h1>Opening Compass</h1><p id="status">Loading the finalized M25.2 workspace…</p><div class="bar"><span></span></div></main>
<script>
(async()=>{
  const parts=[1,2,3,4,5,6].map(n=>`payload-${String(n).padStart(2,"0")}.txt`);
  try{
    const responses=await Promise.all(parts.map(async path=>{const r=await fetch(path,{cache:"no-store"});if(!r.ok)throw new Error(`${path}: ${r.status}`);return r.text()}));
    const encoded=responses.join("");
    const binary=atob(encoded);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    if(typeof DecompressionStream!=="function")throw new Error("This browser does not support DecompressionStream.");
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    const app=await new Response(stream).text();
    document.open();document.write(app);document.close();
  }catch(error){
    document.getElementById("status").textContent=`Compass could not open: ${error.message}`;
    console.error(error);
  }
})();
</script>
</body>
</html>
